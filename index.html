<style>

  .mark { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); display: grid;

  input[type="password"] { width: 100%; font: inherit; font-size: 17px; padding: 13px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--ivory); color: var(--ink); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }
  .remember { display: flex; gap: 10px; align-items: center; font-weight: 400; margin: 16px 0 22px; color: var(--ink-soft); }
  .remember input { width: 20px; height: 20px; accent-color: var(--plum); }
  button { width: 100%; font: inherit; font-weight: 600; font-size: 16px; padding: 14px; border: 0; border-radius: 999px;
    background: var(--plum); color: #fff; cursor: pointer; }
  button[disabled] { opacity: 0.7; cursor: wait; }
  .error { color: var(--error); font-size: 14px; margin: 14px 0 0; min-height: 1.2em; }

  var KEY_NAME = "scentPreviewKey:" + P.salt;
  function bytes(b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); }
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function read(store) { try { return store.getItem(KEY_NAME); } catch (e) { return null; } }
  function write(store, v) { try { store.setItem(KEY_NAME, v); } catch (e) {} }

  async function decrypt(rawKey) {
    var key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.data));
    return new TextDecoder().decode(plain);
  }
  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  // document.write only replaces the page once parsing has finished, so a
  // remembered key waits for the load event before swapping the preview in.
  var saved = read(localStorage) || read(sessionStorage);
  if (saved) {
    var card = document.querySelector("main");
    card.hidden = true;
    window.addEventListener("load", function () {
      decrypt(bytes(saved)).then(show, function () { card.hidden = false; });
    });
  }

  var form = document.getElementById("unlock");
  var button = document.getElementById("go");
  var error = document.getElementById("error");
  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    error.textContent = "";
    button.disabled = true;
    button.textContent = "Opening…";
    try {
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveBits"]);
      var raw = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: bytes(P.salt), iterations: P.iterations }, base, 256);
      var html = await decrypt(raw);
      write(sessionStorage, b64(raw));
      if (document.getElementById("remember").checked) write(localStorage, b64(raw));
      show(html);
    } catch (e) {
      button.disabled = false;
      button.textContent = "Open the preview";
      error.textContent = "That password didn't work. Check it and try again.";
    }
  });
})();
